name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run verify

      # A smoke test of the published entry point: the report path must work
      # without a TTY, which is also what makes the CLI usable in CI.
      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js report \
            --from packages/cli/fixtures/example-answers.json \
            --markdown "$RUNNER_TEMP/report.md" \
            --json "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/report.md"
          test -s "$RUNNER_TEMP/result.json"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/core/coverage
          if-no-files-found: ignore
          retention-days: 7
